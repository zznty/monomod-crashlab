name: analyze-core

# Analyzes an lldb-written core from a stuck translated test host with SOS, on the same image the core came
# from (so the runtime binaries the core references are present). createdump cannot produce dumps for
# translated processes, but lldb's memory-based writer can.

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run id holding the sos-capture artifact (defaults to the last sos run)
        required: false

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Fetch the capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rid="${{ github.event.inputs.source_run }}"
          if [ -z "$rid" ]; then
            rid=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sos.yml --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "source run: $rid"
          mkdir -p cap
          gh run download "$rid" -R "$GITHUB_REPOSITORY" -n sos-capture -D cap
          ls -la cap
          cat cap/pid.txt || true

      - name: Install SDK + SOS
        uses: nike4613/install-dotnet@cc706db77ed67745a4a4cbae19b2869220e34d27
        with:
          architecture: x64
          version: "11.0"

      - name: Install diagnostic tools
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install -g dotnet-dump || true
          dotnet tool install -g dotnet-sos || true
          dotnet-sos install 2>&1 | tee cap/sos-install.txt || true
          find "$HOME/.dotnet" -name 'libsosplugin*' 2>/dev/null | tee cap/sos-plugin-paths.txt || true

      - name: Analyze the core (lldb + SOS)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          set +e
          core=$(ls cap/core.* 2>/dev/null | head -1)
          plugin=$(find "$HOME/.dotnet" -name 'libsosplugin.dylib' 2>/dev/null | head -1)
          echo "core=$core plugin=$plugin" | tee cap/analysis.txt
          if [ -z "$plugin" ]; then
            echo "no SOS plugin found; install output follows:" | tee -a cap/analysis.txt
            cat cap/sos-install.txt 2>/dev/null | tee -a cap/analysis.txt
            exit 0
          fi

          echo "--- arch diagnostics" >> cap/analysis.txt
          file /usr/bin/lldb >> cap/analysis.txt 2>&1
          lipo -info /usr/bin/lldb >> cap/analysis.txt 2>&1
          file "$plugin" >> cap/analysis.txt 2>&1

          echo "--- native (arm64) lldb + x64 plugin" >> cap/analysis.txt
          lldb --batch -c "$core" -o "plugin load $plugin" -o "quit" >> cap/analysis.txt 2>&1

          echo "--- x86_64 lldb under Rosetta + x64 plugin" >> cap/analysis.txt
          arch -x86_64 lldb --batch -c "$core" \
            -o "plugin load $plugin" \
            -o "clrthreads" \
            -o "clrstack -all" \
            -o "syncblk -all" \
            -o "dumpheap -stat -type System.Threading.LowLevelLock" \
            -o "dumpheap -stat -type System.Threading.LowLevelMonitor" \
            -o "quit" >> cap/analysis.txt 2>&1
          echo "arch -x86_64 lldb rc=$?" >> cap/analysis.txt

          echo "=== fallback: ClrMD on a full-style core is not possible on this image; keep lldb output above" | tee -a cap/analysis.txt
          wc -l cap/analysis.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-analysis
          path: cap/analysis.txt
          if-no-files-found: ignore

  analyze-intel:
    name: analyze the same core on a native Intel runner
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - name: Fetch the capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rid="${{ github.event.inputs.source_run }}"
          if [ -z "$rid" ]; then
            rid=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sos.yml --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          mkdir -p cap
          gh run download "$rid" -R "$GITHUB_REPOSITORY" -n sos-capture -D cap
          ls -la cap

      - name: Install SDK + SOS
        uses: nike4613/install-dotnet@cc706db77ed67745a4a4cbae19b2869220e34d27
        with:
          architecture: x64
          version: "11.0"

      - name: Analyze with native x86_64 lldb + SOS
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          set +e
          dotnet tool install -g dotnet-sos || true
          dotnet-sos install || true
          core=$(ls cap/core.* | head -1)
          plugin=$(find "$HOME/.dotnet" -name 'libsosplugin.dylib' | head -1)
          echo "core=$core plugin=$plugin" | tee cap/intel-analysis.txt
          file /usr/bin/lldb >> cap/intel-analysis.txt 2>&1
          lldb --batch -c "$core" \
            -o "plugin load $plugin" \
            -o "clrthreads" \
            -o "clrstack -all" \
            -o "syncblk -all" \
            -o "dumpheap -stat -type System.Threading.LowLevelLock" \
            -o "dumpheap -stat -type System.Threading.LowLevelMonitor" \
            -o "quit" >> cap/intel-analysis.txt 2>&1
          echo "lldb rc=$?" >> cap/intel-analysis.txt
          wc -l cap/intel-analysis.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-analysis-intel
          path: cap/intel-analysis.txt
          if-no-files-found: ignore
